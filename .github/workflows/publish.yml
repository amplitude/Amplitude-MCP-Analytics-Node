name: Release

# Two runs, because one job cannot stay open while a pull request is reviewed.
#
# 1. workflow_dispatch on main opens or updates the release pull request.
#    release-please reads Conventional Commits since the last tag, bumps
#    package.json, and prepends CHANGELOG.md. It does not tag or publish.
#    The pull request is authored with the AMPLITUDE_DEV_EXP GitHub App so
#    that test.yml and semantic-pr.yml run. A GITHUB_TOKEN pull request
#    does not trigger other workflows.
# 2. A push to main does not open or update that pull request. Merging the
#    release pull request tags the release commit from step 1 (its parent is
#    main at the time the pull request was opened) and publishes that commit.
#    A commit that lands on main later is not in the tag. "Update branch" on
#    the release pull request is rejected; re-run this workflow instead.
#
# npm trusted publishing is bound to this filename (publish.yml) and to an
# empty GitHub environment. Renaming the file, or adding an environment to
# the publish job, requires the same change on the npm trusted publisher.
#
# The open-release-pr job reads AMPLITUDE_DEV_EXP_APP_ID and
# AMPLITUDE_DEV_EXP_PRIVATE_KEY from the npm-release environment. Those are
# the same GitHub App credentials used by the other SDK repos. Until that
# environment and those secrets exist, a manual run fails. Pushes to main
# do not use them.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: npm-release
    steps:
      - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        id: app-token
        with:
          app-id: ${{ secrets.AMPLITUDE_DEV_EXP_APP_ID }}
          private-key: ${{ secrets.AMPLITUDE_DEV_EXP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release:
    name: Tag merged release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      releases_created: ${{ steps.tag.outputs.releases_created }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # release-please would tag the merge commit on main. That commit
      # contains whatever landed after the release pull request opened.
      # Tag the release pull request head instead.
      - name: Tag the release snapshot
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.head.ref=="release-please--branches--main")] | .[0] // empty')
          if [[ -z "$PR_JSON" ]]; then
            echo "releases_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NUMBER=$(jq -r .number <<< "$PR_JSON")
          git fetch origin "pull/${NUMBER}/head"
          RELEASE_HEAD=$(git rev-parse FETCH_HEAD)
          SNAPSHOT=$(bash .github/scripts/resolve-release-snapshot.sh "$RELEASE_HEAD" "$GITHUB_SHA")
          VERSION=$(git show "${SNAPSHOT}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          TAG="v${VERSION}"
          NOTES=$(jq -r .body <<< "$PR_JSON")
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SNAPSHOT" -m "Release ${TAG}"
          git push origin "$TAG"
          gh release create "$TAG" --target "$SNAPSHOT" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag

          echo "releases_created=true" >> "$GITHUB_OUTPUT"
          echo "sha=${SNAPSHOT}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run test:typescript

      - name: Run tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
