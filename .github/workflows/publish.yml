name: release-please

# A push to main opens or updates one release pull request from Conventional
# Commits since the last tag. Further pushes keep updating that same pull
# request. Merging it is what tags the release and publishes to npm.
#
# The release pull request is authored with the AMPLITUDE_DEV_EXP GitHub App
# so that test.yml and semantic-pr.yml run. A GITHUB_TOKEN pull request does
# not trigger other workflows.
#
# npm trusted publishing is bound to this filename (publish.yml) and to an
# empty GitHub environment. Renaming the file, or adding an environment to
# the publish job, requires the same change on the npm trusted publisher.
#
# AMPLITUDE_DEV_EXP_APP_ID and AMPLITUDE_DEV_EXP_PRIVATE_KEY are read from
# the npm-release environment. Those are the same GitHub App credentials
# used by the other SDK repos. Until that environment and those secrets
# exist, every push to main fails this workflow. The environment must not
# require a reviewer, or every push to main waits for approval.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    environment: npm-release
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        id: app-token
        with:
          app-id: ${{ secrets.AMPLITUDE_DEV_EXP_APP_ID }}
          private-key: ${{ secrets.AMPLITUDE_DEV_EXP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run test:typescript

      - name: Run tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
