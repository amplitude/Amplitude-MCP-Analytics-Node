name: Open Release PR

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (no commit, no tag)
        id: bump
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          NEW_VERSION=$(npm version "$VERSION_BUMP" --no-git-tag-version)
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create branch, commit, push, open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git checkout -b "$BRANCH"
          git commit -am "chore(release): ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): ${VERSION}" \
            --body "Automated release PR for ${VERSION}.

After merging, push the tag to trigger the publish workflow:

\`\`\`
git fetch origin main && git checkout origin/main
git tag ${VERSION}
git push origin ${VERSION}
\`\`\`"
