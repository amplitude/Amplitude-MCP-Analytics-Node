name: Taxonomy Event Identifier Tests

on:
  pull_request:
    paths:
      - 'plugins/amplitude/skills/taxonomy/reference/**'
  push:
    branches:
      - main
    paths:
      - 'plugins/amplitude/skills/taxonomy/reference/**'

jobs:
  reference-tests:
    name: GLO-1707 reference regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run taxonomy event identifier tests
        working-directory: plugins/amplitude/skills/taxonomy/reference/mcp-server
        run: node --experimental-strip-types --test event-identifier.test.ts
